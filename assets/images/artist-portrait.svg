<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EC"/>
      <stop offset="50%" stop-color="#E8B8A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E9D477" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#344D48" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#warmBg)"/>
  
  <!-- Subtle artistic frame -->
  <rect x="40" y="40" width="720" height="920" rx="32" fill="none" stroke="#344D48" stroke-opacity="0.15" stroke-dasharray="8 8" stroke-width="2"/>
  <rect x="60" y="60" width="680" height="880" rx="24" fill="#FFFFFF" fill-opacity="0.6" filter="url(#softShadow)"/>

  <!-- Artistic Central Composition -->
  <g transform="translate(400, 440)">
    <!-- Easel silhouette -->
    <path d="M-80 180 L-20 -120 L20 -120 L80 180 Z" fill="#9BB5A0" opacity="0.35"/>
    <rect x="-140" y="100" width="280" height="14" rx="7" fill="#344D48" opacity="0.7"/>
    <path d="M0 -140 L0 180" stroke="#344D48" stroke-width="6" opacity="0.4" stroke-linecap="round"/>

    <!-- Small Canvas on Easel -->
    <g transform="translate(0, 10)">
      <rect x="-110" y="-110" width="220" height="220" rx="16" fill="#F7F3EC" stroke="#344D48" stroke-width="3" filter="url(#softShadow)"/>
      
      <!-- Painted artwork strokes on the mini canvas -->
      <path d="M-80 -40 Q-20 -80 60 -50 Q90 10 30 60 Q-50 80 -80 -40" fill="#E8B8A0" opacity="0.85"/>
      <circle cx="20" cy="-10" r="45" fill="#E9D477" opacity="0.8"/>
      <path d="M-60 40 C-30 0, 10 50, 70 30 C50 70, -20 80, -60 40" fill="#9BB5A0" opacity="0.85"/>
      <circle cx="-10" cy="15" r="28" fill="#344D48" opacity="0.85"/>
      <circle cx="-10" cy="15" r="14" fill="#F7F3EC"/>
    </g>

    <!-- Artist Palette & Brushes -->
    <g transform="translate(110, 140)">
      <ellipse cx="0" cy="0" rx="60" ry="42" fill="#E8B8A0" stroke="#344D48" stroke-width="3"/>
      <circle cx="28" cy="10" r="12" fill="#FFFFFF"/>
      <circle cx="-30" cy="-8" r="7" fill="#344D48"/>
      <circle cx="-10" cy="-18" r="7" fill="#E9D477"/>
      <circle cx="12" cy="-18" r="7" fill="#9BB5A0"/>
      <circle cx="-25" cy="12" r="7" fill="#F7F3EC"/>

      <!-- Paintbrush -->
      <line x1="-70" y1="50" x2="30" y2="-50" stroke="#344D48" stroke-width="4" stroke-linecap="round"/>
      <path d="M26 -46 L38 -58 L46 -50 L34 -38 Z" fill="#9BB5A0"/>
    </g>
  </g>

  <!-- Descriptive Typography -->
  <text x="400" y="730" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#29251F" text-anchor="middle" letter-spacing="0.5">
    Anjali · Artist
  </text>
  <text x="400" y="775" font-family="'DM Sans', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#344D48" text-anchor="middle" letter-spacing="1.5">
    A LITTLE UNFRAMED
  </text>
  <text x="400" y="820" font-family="'DM Sans', -apple-system, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle">
    Handmade Canvas Paintings · Kerala, India
  </text>

  <!-- Replaceable Photo Hint -->
  <g transform="translate(400, 880)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#F7F3EC" stroke="#9BB5A0" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#344D48" text-anchor="middle" letter-spacing="0.5">
      PHOTO SLOT: assets/images/artist-portrait.jpg
    </text>
  </g>
</svg>
